steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - '-c'
      - |
        docker build -t ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:latest \
          --build-arg DATABASE_URL="$$DATABASE_URL" \
          --build-arg DISCORD_WEBHOOK_URL="$$DISCORD_WEBHOOK_URL" \
          --build-arg GA_TRACKING_ID="$$GA_TRACKING_ID" \
          --build-arg GITHUB_CLIENT_ID="$$GITHUB_CLIENT_ID" \
          --build-arg GITHUB_SECRET="$$GITHUB_SECRET" \
          --build-arg MICROCMS_API_KEY="$$MICROCMS_API_KEY" \
          --build-arg MICROCMS_SERVICE_DOMAIN="$$MICROCMS_SERVICE_DOMAIN" \
          --build-arg NUXT_SESSION_PASSWORD="$$NUXT_SESSION_PASSWORD" \
          --build-arg TURNSTILE_SECRET_KEY="$$TURNSTILE_SECRET_KEY" \
          --build-arg TURNSTILE_SITE_KEY="$$TURNSTILE_SITE_KEY" \
          .
    secretEnv: ['DATABASE_URL','DISCORD_WEBHOOK_URL','GA_TRACKING_ID','GITHUB_CLIENT_ID','GITHUB_SECRET','MICROCMS_API_KEY','MICROCMS_SERVICE_DOMAIN','NUXT_SESSION_PASSWORD','TURNSTILE_SECRET_KEY','TURNSTILE_SITE_KEY']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:latest']

  # マイグレーションを実行
  - name: '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:latest'
    entrypoint: 'pnpm'
    args: ['exec', 'prisma', 'migrate', 'deploy']
    secretEnv: ['DATABASE_URL']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args: 
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image ${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE}:latest \
          --platform ${_PLATFORM} \
          --region ${_DEPLOY_REGION} \
          --allow-unauthenticated \
          --set-secrets="DATABASE_URL=${_SECRET_PREFIX}DATABASE_URL:latest,\
          DISCORD_WEBHOOK_URL=${_SECRET_PREFIX}DISCORD_WEBHOOK_URL:latest,\
          GA_TRACKING_ID=${_SECRET_PREFIX}GA_TRACKING_ID:latest,\
          GITHUB_CLIENT_ID=${_SECRET_PREFIX}GITHUB_CLIENT_ID:latest,\
          GITHUB_SECRET=${_SECRET_PREFIX}GITHUB_SECRET:latest,\
          MICROCMS_API_KEY=${_SECRET_PREFIX}MICROCMS_API_KEY:latest,\
          MICROCMS_SERVICE_DOMAIN=${_SECRET_PREFIX}MICROCMS_SERVICE_DOMAIN:latest,\
          NUXT_SESSION_PASSWORD=${_SECRET_PREFIX}NUXT_SESSION_PASSWORD:latest,\
          TURNSTILE_SECRET_KEY=${_SECRET_PREFIX}TURNSTILE_SECRET_KEY:latest,\
          TURNSTILE_SITE_KEY=${_SECRET_PREFIX}TURNSTILE_SITE_KEY:latest"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}DISCORD_WEBHOOK_URL/versions/latest
      env: DISCORD_WEBHOOK_URL
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}GA_TRACKING_ID/versions/latest
      env: GA_TRACKING_ID
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}GITHUB_CLIENT_ID/versions/latest
      env: GITHUB_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}GITHUB_SECRET/versions/latest
      env: GITHUB_SECRET
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}MICROCMS_API_KEY/versions/latest
      env: MICROCMS_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}MICROCMS_SERVICE_DOMAIN/versions/latest
      env: MICROCMS_SERVICE_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}NUXT_SESSION_PASSWORD/versions/latest
      env: NUXT_SESSION_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}TURNSTILE_SECRET_KEY/versions/latest
      env: TURNSTILE_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/${_SECRET_PREFIX}TURNSTILE_SITE_KEY/versions/latest
      env: TURNSTILE_SITE_KEY

substitutions:
  _AR_HOSTNAME: asia-northeast1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _PLATFORM: managed
  _DEPLOY_REGION: asia-northeast1
  _SERVICE: mq1-web
  _SECRET_PREFIX: "" # Default to empty for backward compatibility if needed, but TF will override

options:
  logging: CLOUD_LOGGING_ONLY
  